services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: paragrafen
      POSTGRES_PASSWORD: paragrafen
      POSTGRES_DB: paragrafen
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paragrafen -d paragrafen"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
